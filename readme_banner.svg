<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="100%" stop-color="#14192F" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>
    <linearGradient id="accent-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="100%" stop-color="#FFB199" />
    </linearGradient>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A213D" stop-opacity="0" />
      <stop offset="50%" stop-color="#1A213D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1A213D" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-text" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&amp;display=swap');
    
    .text-title {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: #FFFFFF;
      letter-spacing: 4px;
    }
    
    .text-subtitle {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #8F9CAE;
      letter-spacing: 8px;
    }

    .text-role {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #FFFFFF;
    }

    /* Keyframe Animations */
    @keyframes pulse {
      0% { opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { opacity: 0.2; }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes bar-grow {
      0% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
      100% { transform: scaleY(0.35); }
    }

    /* CSS Classes */
    .grid-pattern {
      animation: pulse 6s ease-in-out infinite;
    }

    .data-flow-line {
      stroke: #00F2FE;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 8, 12;
      animation: dash 1.5s linear infinite;
    }

    .data-flow-line-reverse {
      stroke: #FF0844;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 8, 12;
      animation: dash 1.5s linear infinite reverse;
    }

    .node {
      animation: float 4s ease-in-out infinite;
    }

    .node-admin { animation-delay: 0s; }
    .node-teacher { animation-delay: 1.3s; }
    .node-student { animation-delay: 2.6s; }

    .chart-bar-1 { animation: bar-grow 3s ease-in-out infinite alternate; transform-origin: bottom; transform-box: fill-box; }
    .chart-bar-2 { animation: bar-grow 4s ease-in-out infinite alternate; transform-origin: bottom; transform-box: fill-box; animation-delay: 0.5s; }
    .chart-bar-3 { animation: bar-grow 2.5s ease-in-out infinite alternate; transform-origin: bottom; transform-box: fill-box; animation-delay: 1s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid -->
  <g class="grid-pattern" opacity="0.3">
    <!-- Horizontal lines -->
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="url(#grid-grad)" stroke-width="1" />
    <!-- Vertical lines -->
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="url(#grid-grad)" stroke-width="1" />
  </g>

  <!-- Glowing background blobs -->
  <circle cx="200" cy="200" r="120" fill="#4FACFE" opacity="0.12" filter="url(#glow-purple)" />
  <circle cx="1000" cy="200" r="150" fill="#E100FF" opacity="0.1" filter="url(#glow-purple)" />

  <!-- Flowing Data Lines from Center to Roles -->
  <!-- Center: (600, 200) -->
  <!-- Admin: Left (200, 200) -->
  <!-- Teacher: Right-Top (980, 110) -->
  <!-- Student: Right-Bottom (980, 290) -->
  <path d="M 600,185 C 450,185 330,200 250,200" fill="none" class="data-flow-line" />
  <path d="M 600,200 C 720,200 840,110 930,110" fill="none" class="data-flow-line" />
  <path d="M 600,215 C 720,215 840,290 930,290" fill="none" class="data-flow-line-reverse" />

  <!-- Center Core Logo (Glowing Core) -->
  <g transform="translate(600, 200)">
    <circle r="65" fill="#0C0E1A" stroke="#2A3056" stroke-width="3" />
    <circle r="50" fill="#151930" stroke="url(#accent-cyan)" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Core Animated Symbol -->
    <path d="M -15,-15 L 15,-15 L 20,0 L 15,15 L -15,15 L -20,0 Z" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <circle r="8" fill="url(#accent-pink)" />
  </g>

  <!-- Node: Admin -->
  <g class="node node-admin" transform="translate(200, 200)">
    <circle r="45" fill="#111424" stroke="url(#accent-cyan)" stroke-width="2" filter="url(#glow-cyan)" />
    <text x="0" y="5" text-anchor="middle" class="text-role">ADMIN</text>
    <!-- Decorative mini card -->
    <rect x="-65" y="-75" width="130" height="20" rx="6" fill="#1D223B" opacity="0.8" />
    <circle cx="-45" cy="-65" r="4" fill="#00F2FE" />
    <rect x="-32" y="-68" width="80" height="6" rx="3" fill="#8F9CAE" />
  </g>

  <!-- Node: Teacher -->
  <g class="node node-teacher" transform="translate(980, 110)">
    <circle r="45" fill="#111424" stroke="url(#accent-purple)" stroke-width="2" filter="url(#glow-purple)" />
    <text x="0" y="5" text-anchor="middle" class="text-role">TEACHER</text>
    <!-- Small chart preview sticking out -->
    <g transform="translate(-70, -60)">
      <rect x="0" y="0" width="40" height="30" rx="4" fill="#1D223B" />
      <rect x="6" y="22" width="6" height="-12" class="chart-bar-1" fill="#00F2FE" />
      <rect x="17" y="22" width="6" height="-18" class="chart-bar-2" fill="#E100FF" />
      <rect x="28" y="22" width="6" height="-8" class="chart-bar-3" fill="#00F2FE" />
    </g>
  </g>

  <!-- Node: Student -->
  <g class="node node-student" transform="translate(980, 290)">
    <circle r="45" fill="#111424" stroke="url(#accent-pink)" stroke-width="2" filter="url(#glow-purple)" />
    <text x="0" y="5" text-anchor="middle" class="text-role">STUDENT</text>
    <!-- Small badge overlay -->
    <g transform="translate(30, -50)">
      <circle r="12" fill="#1D223B" stroke="#FF0844" stroke-width="1.5" />
      <path d="M-4,-2 L0,2 L5,-3" fill="none" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Typography (Center Title) -->
  <text x="600" y="110" text-anchor="middle" class="text-title" filter="url(#glow-text)">SMART SCHOOL</text>
  <text x="600" y="315" text-anchor="middle" class="text-subtitle">UNIFIED MANAGEMENT ECOSYSTEM</text>
</svg>
